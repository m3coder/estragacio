<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estácio Suite Multi-Model AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="../icons/cat_dancing.gif" class="cat-dancing-avatar" alt="Mascote">
        <h1>Estácio Suite AI</h1>
      </div>
      <span class="badge" id="statusBadge">Pronto</span>
    </header>

    <main class="main">
      <div class="form-group">
        <label for="provider">Inteligência Artificial Ativa</label>
        <select id="provider">
          <option value="groq">Groq (🔥 100% Grátis • 14.4k req/dia • Recomendado)</option>
          <option value="gemini">Google Gemini (🎁 Grátis 1.500 req/dia • Gemini 2.5 Flash)</option>
          <option value="nous">Nous Research / Portal (🔥 100% Grátis • Laguna / LongCat / Hy3)</option>
          <option value="openrouter">OpenRouter (Free Tier & Router)</option>
          <option value="ollama">Ollama (🖥️ Local • Offline • 100% Grátis & Ilimitado)</option>
          <option value="mistral">Mistral AI (Codestral / Large PhD)</option>
          <option value="claude">Anthropic Claude (3.7 Sonnet / 3.5 Sonnet)</option>
          <option value="openai">OpenAI (ChatGPT / GPT-4o Mini / o3-mini)</option>
          <option value="deepseek">DeepSeek (R1 Reasoning / V3)</option>
        </select>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <label for="modelSelect" style="margin-bottom:0;">Modelo Selecionado</label>
          <div style="display:flex; gap:6px; align-items:center;">
            <button id="toggleFreeModeBtn" title="Alternar entre apenas modelos 100% gratuitos ou todos os modelos" style="background:#065f46; color:#a7f3d0; border:1px solid #059669; border-radius:4px; font-size:10px; cursor:pointer; padding:1px 6px; font-weight:700;">🟢 Apenas Free</button>
            <button id="refreshModelsBtn" title="Buscar lista de modelos ao vivo da API" style="background:none; border:none; color:#38bdf8; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:3px; font-weight:600;">
              <span>🔄</span> Atualizar
            </button>
          </div>
        </div>
        <select id="modelSelect"></select>
        <small id="modelLoadingNotice" style="color:#38bdf8; font-size:10px; display:none; margin-top:2px;">⏳ Sincronizando modelos com a API...</small>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <label for="apiKeyInput" style="margin-bottom:0;">Chave de API do Provedor Atual</label>
          <button id="toggleAllKeysBtn" style="background:none; border:none; color:#60a5fa; font-size:11px; cursor:pointer;">🔑 Ver Todas as Chaves</button>
        </div>
        <input type="password" id="apiKeyInput" placeholder="Cole sua chave aqui (ou deixe vazio p/ Ollama local)...">
      </div>

      <!-- Painel com todas as chaves salvas simultaneamente -->
      <div id="allKeysPanel" class="hidden" style="background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px; margin-bottom:12px; font-size:11px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-weight:700; color:#cbd5e1; margin-bottom:2px;">🔑 Banco de Chaves (Sincronizado):</div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Groq Key (console.groq.com):</label>
          <input type="password" id="keyGroq" placeholder="gsk_..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Google Gemini Key (aistudio.google.com):</label>
          <input type="password" id="keyGemini" placeholder="Sua chave Gemini..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Nous Research Key (portal.nousresearch.com):</label>
          <input type="password" id="keyNous" placeholder="Sua chave Nous..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">OpenRouter Key (openrouter.ai):</label>
          <input type="password" id="keyOpenRouter" placeholder="sk-or-v1-..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Ollama URL / Host (Local):</label>
          <input type="text" id="keyOllama" placeholder="http://localhost:11434 (padrão)" style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Mistral Key (console.mistral.ai):</label>
          <input type="password" id="keyMistral" placeholder="Sua chave Mistral..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">Anthropic Claude Key (console.anthropic.com):</label>
          <input type="password" id="keyClaude" placeholder="sk-ant-..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">OpenAI Key (platform.openai.com):</label>
          <input type="password" id="keyOpenAI" placeholder="sk-..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
        <div>
          <label style="color:#94a3b8; display:block; margin-bottom:2px;">DeepSeek Key (platform.deepseek.com):</label>
          <input type="password" id="keyDeepSeek" placeholder="sk-..." style="width:100%; padding:4px 8px; border-radius:4px; background:#1e293b; border:1px solid #334155; color:#fff;">
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">Salvar Configurações</button>
        <button id="testBtn" class="btn btn-secondary">Testar Conexão Live</button>
      </div>

      <div id="statusMessage" class="status-msg hidden"></div>
    </main>

    <footer class="footer">
      <small>Estácio Suite AI v2.5.5 • Groq, Gemini, Nous, OpenRouter, Ollama, Mistral, Claude, OpenAI & DeepSeek</small>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
